name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: typecheck + tests (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # Lowest version allowed by package.json "engines" (node:sqlite is unflagged from 22.13) and the current LTS.
        node: ["22.13", "24"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      # --ignore-scripts: no dependency install scripts run in CI (supply-chain hardening, and npm 11
      # "allowScripts" approvals become irrelevant). Tests use a fake LLM and fake embeddings, so the
      # onnxruntime-node / transformers runtime is never loaded. No secrets, no network calls in tests.
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm test

  admin:
    name: admin panel build + tests (Node 24)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: admin
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: admin/package-lock.json
      # Same supply-chain hardening as the root job; the Angular toolchain works without install scripts.
      - run: npm ci --ignore-scripts
      # Vitest + jsdom in Node (the Angular 22 default): no browser or system packages needed.
      - run: npx ng test --watch=false
      - run: npx ng build
